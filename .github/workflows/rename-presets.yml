name: Normalize SoundFac Preset Names
on:
  push:
    paths:
      - '.github/workflows/rename-presets.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename presets and JSON names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          repl={
            '"Ghost Moan — Deep":{name:"Deep Ghost Moan"':'"Deep Ghost":{name:"Deep Ghost"',
            '"Owl — Night Hoot":{name:"Night Owl Hoot"':'"Night Owl":{name:"Night Owl"',
            '"Wind — Dark":{name:"Dark Wind"':'"Dark Wind":{name:"Dark Wind"',
            '"Heartbeat — Close":{name:"Close Heartbeat"':'"Close Heartbeat":{name:"Close Heartbeat"',
            '"Thunder — Distant":{name:"Distant Thunder"':'"Distant Thunder":{name:"Distant Thunder"',
            '"Knock — Hollow":{name:"Hollow Knock"':'"Hollow Knock":{name:"Hollow Knock"',
            '"Drip — Echo":{name:"Water Drip"':'"Echoing Drip":{name:"Echoing Drip"',
            '"Clock — Tick":{name:"Clock Tick"':'"Clock Tick":{name:"Clock Tick"',
            '"Custom — Reference":{name:"Custom Reference"':'"Custom Sound":{name:"Custom Sound"',
          }
          for old,new in repl.items():
            if old not in s:
              raise SystemExit(f'missing: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('service-worker.js')
          w=sw.read_text().replace("const CACHE='soundfac-v13';","const CACHE='soundfac-v14';")
          sw.write_text(w)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Normalize preset and recipe names" || exit 0
          git push
