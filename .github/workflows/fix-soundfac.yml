name: Fix SoundFac
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>SoundLab</title>','<title>soundfac</title>')
          s=s.replace('<link rel="icon" href="icon.svg" type="image/svg+xml">\n','')
          s=s.replace('.mark svg{width:25px}', '.mark img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}')
          s=s.replace('<div class="brand"><div class="mark"><svg viewBox="0 0 64 64" fill="none"><path d="M8 34h8l5-16 8 31 8-38 7 31 5-8h7" stroke="#c494ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="title">SoundLab</div><div class="sub">Design, generate and save sound effects in your browser.</div></div></div>', '<div class="brand"><div class="mark"><img src="icon-192.png" alt=""></div><div><div class="title">soundfac</div><div class="sub">Design, generate and save sound effects in your browser.</div></div></div>')
          s=s.replace('SoundLab only interprets supported sound instructions;', 'soundfac only interprets supported sound instructions;')
          s=s.replace('.control{display:grid;grid-template-columns:120px 1fr 66px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1f1f27}', '.control{display:grid;grid-template-columns:120px minmax(0,1fr) 66px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1f1f27;min-width:0}')
          s=s.replace('.slider{width:100%;accent-color:#9c6ed6}', '.slider{display:block;width:100%;min-width:0;max-width:100%;accent-color:#9c6ed6;margin:0}')
          s=s.replace('.group-body{padding:0 10px 10px;border-top:1px solid #25252f}', '.group-body{padding:0 10px 10px;border-top:1px solid #25252f;min-width:0}')
          s=s.replace('@media(max-width:480px){.title{font-size:19px}.sub{display:none}.control{grid-template-columns:94px 1fr 58px}', '@media(max-width:480px){.title{font-size:19px}.sub{display:none}.control{grid-template-columns:82px minmax(0,1fr) 52px;gap:7px}')
          old="function rng(seed=1234567){return()=>((seed=Math.imul(seed^seed>>>15,1|seed))^seed+Math.imul(seed^seed>>>7,61|seed)>>>14)>>>0/4294967296}"
          new="function rng(seed=1234567){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}"
          s=s.replace(old,new)
          old2="const place=(def,at=0)=>{const d=Math.max(.05,Math.min(dur-at,def.duration??(dur-at))),mono=synth(def,d,sr,seed++),pan=Math.max(-1,Math.min(1,def.pan??0)),lg=Math.cos((pan+1)*Math.PI/4),rg=Math.sin((pan+1)*Math.PI/4),off=Math.floor(at*sr);add(L,mono,off,lg);add(R,mono,off,rg)};"
          new2="const place=(def,at=0)=>{const type=(def.type||def.effect||'oscillator').toLowerCase(),defaults={owl:4.2,owl_hoot:4.2,thunder:4.8,creak:2.4,knock:2.2,drip:3.2,tick:5,buzz:dur-at,wind:dur-at,noise:dur-at,rumble:dur-at,heartbeat:dur-at,breathing:dur-at,oscillator:dur-at},wanted=def.duration??defaults[type]??(dur-at),d=Math.max(.05,Math.min(dur-at,wanted)),mono=synth(def,d,sr,seed++),pan=Math.max(-1,Math.min(1,def.pan??0)),lg=Math.cos((pan+1)*Math.PI/4),rg=Math.sin((pan+1)*Math.PI/4),off=Math.floor(at*sr);add(L,mono,off,lg);add(R,mono,off,rg)};"
          s=s.replace(old2,new2)
          s=s.replace("(recipe.name||'soundlab')", "(recipe.name||'soundfac')")
          p.write_text(s)

          m=Path('manifest.webmanifest')
          ms=m.read_text().replace('"name": "SoundLab"','"name": "soundfac"').replace('"short_name": "SoundLab"','"short_name": "soundfac"')
          m.write_text(ms)

          sw=Path('service-worker.js')
          sw.write_text(sw.read_text().replace("const CACHE='soundlab-v2';","const CACHE='soundfac-v3';"))
          PY
          rm -f .github/workflows/fix-soundfac.yml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve SoundFac controls and audio synthesis" || exit 0
          git push
