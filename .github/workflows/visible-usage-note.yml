name: Make SoundFac Usage Visible
on:
  push:
    paths:
      - '.github/workflows/visible-usage-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="title">soundfac</div><div class="sub">Design, generate and save sound effects in your browser.</div>'
          new='<div class="title">SoundFac</div><div class="sub">Start with a preset or paste your own recipe. Presets are references, not limits.</div>'
          if old not in s:
              raise SystemExit('header copy not found')
          s=s.replace(old,new)
          old2='''        <div class="preset-row">\n          <select id="preset"></select>\n          <button class="btn" id="randomizeBtn">Randomize</button>\n        </div>'''
          new2='''        <div class="preset-row">\n          <select id="preset"></select>\n          <button class="btn" id="randomizeBtn">Randomize</button>\n        </div>\n        <div class="section-note">Use any preset as a starting point, or paste your own recipe in Advanced JSON. Custom sound names and generic sound settings are supported.</div>'''
          if old2 not in s:
              raise SystemExit('preset row not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          sw=Path('service-worker.js')
          w=sw.read_text().replace("const CACHE='soundfac-v12';","const CACHE='soundfac-v13';")
          sw.write_text(w)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Show SoundFac usage guidance prominently" || exit 0
          git push
