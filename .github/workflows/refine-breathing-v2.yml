name: Refine SoundFac Breathing V2
on:
  push:
    paths:
      - '.github/workflows/refine-breathing-v2.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild breathing synthesis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='"Breathing — Distant":{name:"Distant Breathing",duration_seconds:9,master:{volume:.9,fade_in:.25,fade_out:.5},layers:[{type:"breathing",rate:.22,volume:.32,darkness:.68,echo:.02,pan:0,randomness:.08}]}'
          new='"Breathing — Distant":{name:"Distant Breathing",duration_seconds:9,master:{volume:.92,fade_in:.12,fade_out:.35},layers:[{type:"breathing",rate:.24,volume:.46,darkness:.58,echo:0,pan:0,randomness:.06}]}'
          if old not in s:
              raise SystemExit('breathing preset not found')
          s=s.replace(old,new)
          old2="else if(type==='breathing'){let a=bp(noise(),180,2200,sr),rate=Math.max(.08,def.rate??.22),dark=def.darkness??.68,period=1/rate;for(let i=0;i<n;i++){const t=i/sr,ph=(t%period)/period;let env=0;if(ph<.34){const x=ph/.34;env=Math.pow(Math.sin(Math.PI*x),1.35)*.72}else if(ph<.78){const x=(ph-.34)/.44;env=Math.pow(Math.sin(Math.PI*x),1.15)}else env=0;const chest=.035*Math.sin(2*Math.PI*115*t)*(env>.02?env:0);y[i]=(a[i]*env*v*(.46+.22*(1-dark))+chest*v)*(1+(R()-.5)*rand*.08)}}"
          new2="else if(type==='breathing'){const raw=noise(),air=bp(raw,650,3600,sr),rate=Math.max(.10,def.rate??.24),dark=def.darkness??.58,period=1/rate;for(let i=0;i<n;i++){const t=i/sr,ph=(t%period)/period;let env=0,voiced=0;if(ph<.20){const x=ph/.20;env=Math.pow(Math.sin(Math.PI*x),1.6)*.42}else if(ph<.30){env=0}else if(ph<.60){const x=(ph-.30)/.30;env=Math.pow(Math.sin(Math.PI*x),1.25)*.72;voiced=Math.sin(2*Math.PI*128*t)*.055*Math.pow(Math.sin(Math.PI*x),1.4)}else env=0;const mouth=Math.sin(2*Math.PI*255*t+.35*Math.sin(2*Math.PI*3.1*t))*.022*env;const texture=air[i]*env*(.14+.05*(1-dark));y[i]=(texture+voiced+mouth)*v*(1+(R()-.5)*rand*.04)}}"
          if old2 not in s:
              raise SystemExit('breathing synthesis block not found')
          s=s.replace(old2,new2)
          p.write_text(s)

          sw=Path('service-worker.js')
          w=sw.read_text()
          w=w.replace("const CACHE='soundfac-v7';","const CACHE='soundfac-v8';")
          sw.write_text(w)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Rebuild SoundFac breathing without wind texture" || exit 0
          git push
