name: Refine SoundFac Door Creak
on:
  push:
    paths:
      - '.github/workflows/refine-door-creak.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update creak synthesis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='"Door Creak":{name:"Door Creak",duration_seconds:3.5,master:{volume:.9,fade_in:.05,fade_out:.4},layers:[{type:"creak",start:.35,volume:.66,pitch:210,duration:2.4,depth:.75,echo:.1}]}'
          new='"Door Creak":{name:"Door Creak",duration_seconds:3.2,master:{volume:.92,fade_in:.03,fade_out:.28},layers:[{type:"creak",start:.28,volume:.72,pitch:185,duration:2.15,depth:.82,echo:.02,randomness:.16}]}'
          s=s.replace(old,new)
          old2="else if(type==='creak'){const f0=def.pitch??220,dd=Math.min(dur,def.duration??dur),len=Math.floor(dd*sr);let ph=0;for(let i=0;i<len;i++){const t=i/sr,f=f0-(f0*.58)*(i/len)+5*Math.sin(2*Math.PI*4.4*t);ph+=2*Math.PI*f/sr;const env=Math.pow(Math.sin(Math.PI*i/len),1.25);y[i]=(Math.sin(ph)+.22*Math.sin(2*ph))*env*v}}"
          new2="else if(type==='creak'){const dd=Math.min(dur,def.duration??2.2),len=Math.floor(dd*sr),depth=def.depth??.8,base=def.pitch??185;const raw=noise(),wood=bp(raw,120,1800,sr);let ph=0,last=0;for(let i=0;i<len;i++){const t=i/sr,q=i/len;const tension=Math.pow(Math.sin(Math.PI*q),.75);const pulses=.42+.38*Math.pow(Math.sin(2*Math.PI*(2.1*t+.12*Math.sin(2*Math.PI*.7*t))),8);const jitter=(R()-.5)*(def.randomness??.12)*55;const f=Math.max(70,base*(1-.34*q)+26*Math.sin(2*Math.PI*1.35*t)+jitter);ph+=2*Math.PI*f/sr;const scrape=wood[i]*(.48+.52*pulses);const tone=(Math.sin(ph)+.22*Math.sin(2.37*ph))*tension*.18;const stick=(Math.abs(scrape-last)>.12?Math.sign(scrape)*.16:0);last=scrape;y[i]=(scrape*.72+tone+stick)*tension*v*depth}}"
          if old2 not in s:
              raise SystemExit('old creak synthesis block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild SoundFac door creak as wood friction" || exit 0
          git push
