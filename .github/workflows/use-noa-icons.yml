name: Use existing Noa icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-noa-icons.yml'
permissions:
  contents: write
jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire existing Noa icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link rel="icon" href="icon.svg" type="image/svg+xml">\n','')
          s=s.replace('.mark svg{width:25px}', '.mark img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}')
          old='<div class="brand"><div class="mark"><svg viewBox="0 0 64 64" fill="none"><path d="M8 34h8l5-16 8 31 8-38 7 31 5-8h7" stroke="#c494ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
          new='<div class="brand"><div class="mark"><img src="icon-192.png" alt=""></div>'
          s=s.replace(old,new)
          p.write_text(s)
          sw=Path('service-worker.js')
          t=sw.read_text().replace("const CACHE='soundlab-v1';", "const CACHE='soundlab-v2';")
          sw.write_text(t)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet || git commit -m "Use existing Noa icons"
          git push
