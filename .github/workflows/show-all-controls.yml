name: Show All SoundFac Controls
on:
  push:
    paths:
      - '.github/workflows/show-all-controls.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand all controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(".controls{display:flex;flex-direction:column;gap:8px;width:100%;max-height:68vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;padding:0 8px 8px 0;min-width:0}", ".controls{display:flex;flex-direction:column;gap:8px;width:100%;overflow:visible;padding:0;min-width:0}")
          s=s.replace(".group summary{padding:10px 11px;cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;justify-content:space-between}.group summary::-webkit-details-marker{display:none}.group summary:after{content:'＋';color:#77778a}.group[open] summary:after{content:'−'}", ".group summary{padding:10px 11px;cursor:default;font-weight:650;list-style:none;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.group summary::-webkit-details-marker{display:none}.group summary:after{content:''}")
          s=s.replace("@media(max-width:820px){.app{padding:12px}.top{align-items:flex-start}.status{display:none}.controls{max-height:62vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}", "@media(max-width:820px){.app{padding:12px}.top{align-items:flex-start}.status{display:none}.controls{overflow:visible}")
          s=s.replace("const d=document.createElement('details');d.className='group';d.open=val.length<=3;", "const d=document.createElement('details');d.className='group';d.open=true;")
          s=s.replace("const sub=document.createElement('details');sub.className='group';sub.open=i===0;", "const sub=document.createElement('details');sub.className='group';sub.open=true;")
          s=s.replace("Controls are created from the recipe. Large recipes are grouped automatically.", "All controls are shown. Longer recipes simply extend the page.")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show all SoundFac controls without clipping" || exit 0
          git push
