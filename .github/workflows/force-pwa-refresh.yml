name: Force SoundFac PWA Refresh
on:
  push:
    paths:
      - '.github/workflows/force-pwa-refresh.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force service worker refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});"
          new="if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});"
          if old not in s:
              raise SystemExit('service worker registration not found')
          s=s.replace(old,new)
          p.write_text(s)
          sw=Path('service-worker.js')
          w=sw.read_text()
          w=w.replace("const CACHE='soundfac-v11';","const CACHE='soundfac-v12';")
          sw.write_text(w)
          PY
      - name: Commit
        run: |
          git config user.name "noagrp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Force SoundFac PWA update checks" || exit 0
          git push
